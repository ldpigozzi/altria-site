:root{--azul:#0e499e;--azul-vivo:#2f62d5;--azul-claro:#a9ccff;--coral:#e36148;--creme:#f5f2eb}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;
  padding:clamp(24px,5vw,56px);background:var(--azul);color:var(--creme);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.montanha{position:absolute;right:0;bottom:0;width:min(62vw,760px);height:auto;pointer-events:none}
header,main,footer{position:relative;max-width:1100px;width:100%;margin-inline:auto}
header img{display:block;width:clamp(190px,24vw,280px);height:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-block:48px}
h1{font-family:Menda,Inter,sans-serif;font-weight:900;font-size:clamp(1.5rem,7.4vw,3.4rem);line-height:1.1;max-width:14em}
.sub{margin-top:20px;font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.5;color:var(--azul-claro);max-width:34ch}
.btn{margin-top:36px;padding:16px 30px;border-radius:999px;background:var(--coral);color:#fff;
  font-size:1.1875rem;font-weight:700;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.32)}
.mail{margin-top:16px;color:var(--creme);font-size:.9375rem;text-underline-offset:4px}
a:focus-visible{outline:3px solid var(--creme);outline-offset:4px}
footer{font-size:.8125rem;color:var(--azul-claro)}
@media (max-width:640px){.montanha{width:100vw;opacity:.55}}
@media (prefers-reduced-motion:no-preference){
  header,h1,.sub,.btn,.mail{animation:sobe .7s both}
  .sub{animation-delay:.1s}.btn{animation-delay:.2s}.mail{animation-delay:.25s}
  @keyframes sobe{from{opacity:0;transform:translateY(14px)}}
}
</style>
